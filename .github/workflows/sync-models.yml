name: Sync NVIDIA model list

on:
  schedule:
    # Daily at 05:37 UTC — off-peak minute to reduce GitHub scheduler queueing
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run model list sync (removals + renames + unscored probe)
        env:
          PYTHONIOENCODING: utf-8
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          python3 scripts/sync_models.py --dry-run || exit 1
          python3 scripts/sync_models.py

      - name: Commit model list changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/test_models.py
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync NVIDIA model list (automated)"
            git push
          else
            echo "No model list changes"
          fi

      - name: Trigger benchmark to pick up new list immediately
        if: success()
        run: |
          gh workflow run benchmark.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
